services:
  - type: web
    name: runcrew-coach-ia
    runtime: python
    rootDir: projet/runcrew-coach-ia
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m rag.build_index"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app"
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
